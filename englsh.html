function sm2Update(repetitions, interval, easeFactor, quality) {
  const q = [0, 2, 4, 5][quality] ?? 4;
  if (q < 3) return { repetitions: 0, interval: 1, easeFactor: Math.max(1.3, easeFactor - 0.2) };
  const newEF = Math.max(1.3, easeFactor + 0.1 - (5 - q) * (0.08 + (5 - q) * 0.02));
  const newInterval = repetitions === 0 ? 1 : repetitions === 1 ? 6 : Math.round(interval * easeFactor);
  return { repetitions: repetitions + 1, interval: newInterval, easeFactor: newEF };
}
function daysFromNow(n) { return Date.now() + n * 86400000; }
function isDue(ts) { return Date.now() >= ts; }
function todayStr() { return new Date().toISOString().slice(0, 10); }

const EXERCISES = [
  { id:'e01', type:'complete-sentence', level:'B1', category:'grammar', subcategory:'since-vs-for', question:"I've been working here _____ three years.", options:['for','since','during','from'], correctAnswer:0, explanation:'"For" is used with a duration (three years). "Since" marks a specific point in time (2021, last Monday).', nativeTip:'Ask yourself: "a period of ___"? → for. A specific moment? → since.' },
  { id:'e02', type:'detect-mistake', level:'B1', category:'grammar', subcategory:'since-vs-for', question:"She's been living in Madrid [since] five years.", options:['since','for'], correctAnswer:1, explanation:'"Five years" is a duration, not a point in time. Use "for".' },
  { id:'e03', type:'complete-sentence', level:'B1', category:'grammar', subcategory:'since-vs-for', question:"He hasn't eaten anything _____ this morning.", options:['since','for','during','from'], correctAnswer:0, explanation:'"This morning" is a specific point in time, so use "since".' },
  { id:'e04', type:'natural-vs-unnatural', level:'B2', category:'naturalness', subcategory:'collocations', question:'Which sounds more natural?', options:["I'm very agree with you.","I totally agree with you."], correctAnswer:1, explanation:'"Agree" is a verb, not an adjective — "very" can\'t modify it. Use "totally", "completely", or "fully agree".', nativeTip:'Natives say: I totally agree / I couldn\'t agree more / I completely agree.' },
  { id:'e05', type:'complete-sentence', level:'B2', category:'grammar', subcategory:'present-perfect-vs-past-simple', question:"I _____ my keys. Can you help me find them?", options:['lost','have lost','was losing','lose'], correctAnswer:1, explanation:'Use Present Perfect when the past event still affects the present — the keys are still missing now.', nativeTip:'If the result matters NOW, use Present Perfect.' },
  { id:'e06', type:'detect-mistake', level:'B1', category:'grammar', subcategory:'present-perfect-vs-past-simple', question:"I have seen that movie [last week].", options:['last week','the previous week'], correctAnswer:0, explanation:'"Last week" is a finished, specific time reference — it forces Past Simple: "I saw that movie last week".' },
  { id:'e07', type:'choose-best', level:'B2', category:'grammar', subcategory:'present-perfect-vs-past-simple', question:'Context: someone just arrived at the office. Which is correct?', options:["Did you have breakfast?","Have you had breakfast?","Were you having breakfast?"], correctAnswer:1, explanation:'No specific time is mentioned and the question relates to the current moment — use Present Perfect.' },
  { id:'e08', type:'complete-sentence', level:'B2', category:'grammar', subcategory:'present-perfect-vs-past-simple', question:"We _____ in this house since 2018.", options:['live','lived','have lived','are living'], correctAnswer:2, explanation:'The action started in the past and continues now → Present Perfect + "since".' },
  { id:'e09', type:'natural-vs-unnatural', level:'B2', category:'naturalness', subcategory:'false-friends', question:'Translate: "Actualmente trabajo en Google."', options:["Actually I work at Google.","Currently I work at Google."], correctAnswer:1, explanation:'"Actually" means "en realidad / de hecho", not "actualmente". "Currently" = "actualmente/en este momento".', nativeTip:'"Actually" is a false friend! "I work at Google, actually" = correction or emphasis, not time.' },
  { id:'e10', type:'complete-sentence', level:'B2', category:'grammar', subcategory:'conditionals', question:"If I _____ more time, I would travel more.", options:['have','had','would have','will have'], correctAnswer:1, explanation:'Conditional Type 2 (hypothetical present/future): If + Past Simple, would + infinitive.' },
  { id:'e11', type:'complete-sentence', level:'B2', category:'grammar', subcategory:'conditionals', question:"If it _____ tomorrow, we'll cancel the trip.", options:['rains','rained','will rain','would rain'], correctAnswer:0, explanation:'Conditional Type 1 (real possibility): If + Present Simple, will + infinitive.' },
  { id:'e12', type:'choose-best', level:'C1', category:'grammar', subcategory:'conditionals', question:'Context: talking about a past regret.', options:["If I studied harder, I would pass the exam.","If I had studied harder, I would have passed.","If I would study harder, I passed."], correctAnswer:1, explanation:'Conditional Type 3 (impossible past): If + Past Perfect, would have + past participle.' },
  { id:'e13', type:'natural-vs-unnatural', level:'B2', category:'naturalness', subcategory:'false-friends', question:'Which is the correct translation of "Eventualmente lo terminé"?', options:["Eventually I finished it.","I eventually finished it."], correctAnswer:1, explanation:'Both are grammatically fine, but "I eventually finished it" is more natural word order. Note: "eventually" ≠ "eventualmente" (which means "possibly"). "Eventually" = "finalmente/al final".' },
  { id:'e14', type:'detect-mistake', level:'B2', category:'grammar', subcategory:'articles', question:"She wants to become [a] engineer.", options:['a','an'], correctAnswer:1, explanation:'"Engineer" starts with a vowel sound /ɛ/ → use "an". Rule: use "an" before vowel sounds (not letters).' },
  { id:'e15', type:'complete-sentence', level:'B2', category:'grammar', subcategory:'articles', question:"Can you play _____ piano?", options:['the','a','—','an'], correctAnswer:0, explanation:'Use "the" with musical instruments: play the piano, the guitar, the violin.' },
  { id:'e16', type:'complete-sentence', level:'B1', category:'grammar', subcategory:'articles', question:"I had _____ coffee and _____ sandwich for breakfast.", options:['a / a','the / the','— / a','a / the'], correctAnswer:0, explanation:'First mention of countable nouns → use "a/an". "Coffee" here is being used countably (one coffee).' },
  { id:'e17', type:'complete-sentence', level:'B2', category:'grammar', subcategory:'prepositions-time', question:"The meeting is _____ Monday _____ 3pm.", options:['on / at','in / at','at / on','on / in'], correctAnswer:0, explanation:'"On" for days, "at" for specific times.' },
  { id:'e18', type:'detect-mistake', level:'B1', category:'grammar', subcategory:'prepositions-time', question:"I'll see you [in] the morning.", options:['in','in the'], correctAnswer:1, explanation:'"In the morning" is correct — always use the article: in the morning / in the afternoon / in the evening. Exception: "at night".' },
  { id:'e19', type:'natural-vs-unnatural', level:'B2', category:'naturalness', subcategory:'collocations', question:'Which is natural?', options:["I did a mistake.","I made a mistake."], correctAnswer:1, explanation:'"Make a mistake" is the fixed collocation. Use "make" for: make a decision, make an effort, make progress. Use "do" for: do homework, do exercise, do business.', nativeTip:'Make = create/produce. Do = carry out an activity.' },
  { id:'e20', type:'complete-sentence', level:'B2', category:'grammar', subcategory:'modal-verbs', question:"You _____ be tired after such a long flight.", options:['must','should','might','have to'], correctAnswer:0, explanation:'"Must" expresses logical deduction/certainty based on evidence. "You must be tired" = I\'m certain you are.' },
  { id:'e21', type:'choose-best', level:'B2', category:'grammar', subcategory:'modal-verbs', question:'What is the rule about helmets? (obligation)', options:["You should wear a helmet.","You must wear a helmet.","You might wear a helmet."], correctAnswer:1, explanation:'"Must" = strong obligation (often a rule/law). "Should" = advice/recommendation, not a strict rule.' },
  { id:'e22', type:'natural-vs-unnatural', level:'C1', category:'naturalness', subcategory:'collocations', question:'Which sounds natural?', options:["The news was very shocking.","The news was very surprised."], correctAnswer:0, explanation:'"Shocking" describes the news (it causes shock). "Surprised" describes a person\'s reaction. Common error: mixing -ing/-ed adjectives.', nativeTip:'The movie was boring. I was bored. The news is shocking. I\'m shocked.' },
  { id:'e23', type:'detect-mistake', level:'B2', category:'naturalness', subcategory:'collocations', question:"I'm [very] interested in learning more.", options:['very','very / really'], correctAnswer:0, explanation:'Actually "very interested" IS correct — "interested" is a true adjective here. But "really interested" sounds more natural in speech. Both are fine.', nativeTip:null },
  { id:'e24', type:'translation', level:'B2', category:'naturalness', subcategory:'translation', question:'Translate naturally: "Me enteré de que renunció."', options:["I found out that he resigned.","I informed myself that he resigned.","I found that he resigned."], correctAnswer:0, explanation:'"Enterarse" = "to find out". "Informed myself" is a literal mistranslation. "I found that" means "I discovered/determined" in a research context.', nativeTip:'Colloquially: "I heard he quit." — even more natural!' },
  { id:'e25', type:'translation', level:'B1', category:'naturalness', subcategory:'translation', question:'Translate naturally: "Depende de lo que digas."', options:["It depends of what you say.","It depends on what you say.","It depends from what you say."], correctAnswer:1, explanation:'"Depend" always takes "on" in English, not "of" or "from". This is a classic mistake for Spanish speakers.', nativeTip:'"It depends on..." — memorize this preposition.' },
  { id:'e26', type:'complete-sentence', level:'B2', category:'grammar', subcategory:'present-perfect-vs-past-simple', question:"This is the best film I _____ ever seen.", options:['have','had','was','am'], correctAnswer:0, explanation:'Superlative + "ever" triggers Present Perfect: "the best I have ever seen".' },
  { id:'e27', type:'natural-vs-unnatural', level:'B1', category:'naturalness', subcategory:'false-friends', question:'Translate: "Es una persona muy sensible."', options:["She's a very sensible person.","She's a very sensitive person."], correctAnswer:1, explanation:'"Sensible" in English = "sensato/razonable" (practical). "Sensitive" = "sensible/emotivo". Another classic false friend!', nativeTip:'"Sensible" advice = practical advice. A "sensitive" person = someone who feels deeply.' },
  { id:'e28', type:'complete-sentence', level:'C1', category:'grammar', subcategory:'conditionals', question:"Had I known about the problem, I _____ sooner.", options:['would have called','would call','had called','called'], correctAnswer:0, explanation:'This is an inverted Conditional 3 (formal/written). "Had I known" = "If I had known". Result: "would have + past participle".' },
  { id:'e29', type:'choose-best', level:'B2', category:'grammar', subcategory:'modal-verbs', question:"She _____ be at home — I saw her car outside.", options:["must","should","can","might"], correctAnswer:0, explanation:'"Must" for strong logical deduction. You have evidence (the car) → "must be".' },
  { id:'e30', type:'natural-vs-unnatural', level:'B2', category:'naturalness', subcategory:'collocations', question:'Which is correct?', options:["Do you have the time?","Have you the time?"], correctAnswer:0, explanation:'In modern English, "Do you have...?" is standard. "Have you...?" (without do) sounds very formal/archaic in most contexts.', nativeTip:'British English sometimes uses "Have you got the time?" — also natural.' },
  { id:'e31', type:'detect-mistake', level:'B2', category:'grammar', subcategory:'articles', question:"Life is [a] short.", options:['a','—'], correctAnswer:1, explanation:'"Life" used as a general concept takes no article: "Life is short." Use zero article for abstract/general nouns.' },
  { id:'e32', type:'translation', level:'B2', category:'naturalness', subcategory:'translation', question:'Translate: "Fue un placer conocerte."', options:["It was a pleasure to know you.","It was a pleasure to meet you.","It was nice knowing you."], correctAnswer:1, explanation:'"Conocer" in a first meeting context = "to meet". "To know" = conocer de manera ongoing. "It was a pleasure meeting you" is also very natural.', nativeTip:'"Nice to meet you" (when meeting) vs "Nice knowing you" (when saying goodbye forever — sometimes sarcastic!)' },
  { id:'e33', type:'complete-sentence', level:'B2', category:'grammar', subcategory:'since-vs-for', question:"I've known her _____ we were children.", options:['since','for','during','from'], correctAnswer:0, explanation:'"Since we were children" is a point in time (clause). Use "since" before clauses and specific time references.' },
  { id:'e34', type:'natural-vs-unnatural', level:'C1', category:'naturalness', subcategory:'register', question:'In a formal email, which is better?', options:["I'm writing to ask about the job.","I am writing to enquire about the position."], correctAnswer:1, explanation:'Formal register: "enquire" (not "ask"), "position" (not "job"), no contractions ("I am" not "I\'m").', nativeTip:'Formal: enquire, position, regarding, I would like to. Informal: ask, job, about, I want to.' },
  { id:'e35', type:'choose-best', level:'B2', category:'grammar', subcategory:'prepositions-time', question:"She graduated _____ 2019.", options:["in","on","at","—"], correctAnswer:0, explanation:'Use "in" for years, months, and seasons: in 2019, in March, in summer.' },
];

const THEORY_CARDS = [
  { id:'t01', title:'Present Perfect vs Past Simple', subtitle:'The most confused tense pair at B1+', level:'B1', rule:'Use Present Perfect when the past connects to NOW. Use Past Simple when time is specific and finished.', examples:[{correct:"I've lost my keys.", note:'Still lost = present connection'},{correct:"I lost my keys yesterday.", note:'Specific finished time → Past Simple'},{incorrect:"I've seen him last week.", correct2:"I saw him last week.", note:'"Last week" forces Past Simple'}], trap:'Time expressions like yesterday, last week, in 2019, ago → always Past Simple.', tags:['tenses','B1','very-common'] },
  { id:'t02', title:'Conditionals — The 4 Types', subtitle:'Real vs hypothetical vs impossible', level:'B2', rule:'Type 0: facts. Type 1: real future. Type 2: hypothetical present. Type 3: impossible past.', examples:[{correct:'If you heat water to 100°C, it boils.', note:'Type 0 — general truth'},{correct:"If it rains, I'll stay home.", note:'Type 1 — real possibility'},{correct:'If I had more time, I would travel.', note:'Type 2 — hypothetical'},{correct:'If I had studied, I would have passed.', note:'Type 3 — past regret'}], trap:'Never use "would" in the IF clause: ✗ "If I would have..." → ✓ "If I had..."', tags:['conditionals','B2','grammar'] },
  { id:'t03', title:'Articles: a / an / the / ∅', subtitle:'The rules native speakers follow instinctively', level:'B2', rule:'a/an = first mention or non-specific. the = shared reference or unique. ∅ = general/abstract concepts.', examples:[{correct:'I saw a dog. The dog was barking.', note:'First mention → a. Second mention → the'},{correct:'Life is short. / Music is universal.', note:'Abstract nouns → no article'},{correct:'She plays the piano.', note:'Instruments → always "the"'},{incorrect:'She is a best student.', correct2:'She is the best student.', note:'Superlatives → always "the"'}], trap:'"The" before countries is usually wrong: ✗ "the Spain" → ✓ "Spain". Exceptions: the USA, the UK, the Netherlands.', tags:['articles','B2','tricky'] },
  { id:'t04', title:'Modal Verbs — Obligation & Deduction', subtitle:"must / should / have to / need to / can't", level:'B2', rule:'For obligation: must (strong/internal) vs have to (external rule). For deduction: must (certain) vs might (possible) vs can\'t (impossible).', examples:[{correct:'You must wear a seatbelt.', note:'Rule/obligation — "must"'},{correct:'You should eat more vegetables.', note:'Advice — "should"'},{correct:'She must be tired.', note:'Logical certainty based on evidence'},{correct:"He can't be 40 — he looks 25.", note:'Impossibility'}], trap:'"Must" has no past form. Past deduction: "must have been": "She must have been tired."', tags:['modals','B2','deduction'] },
  { id:'t05', title:'Collocations: make vs do', subtitle:'The pair that trips up every Spanish speaker', level:'B1', rule:'"Make" = create, produce, or cause. "Do" = perform an activity, task, or duty.', examples:[{correct:'make a decision / make a mistake / make progress / make an effort', note:'make = produce/create'},{correct:'do homework / do exercise / do business / do a course', note:'do = carry out an activity'},{incorrect:'do a mistake', correct2:'make a mistake', note:'Most learners say "do" here!'},{incorrect:'make homework', correct2:'do homework', note:'Classic error'}], trap:'Some phrases break the rules: "do your best" (not "make"), "make a bed" (not "do"). Learn them as chunks.', tags:['collocations','B1','make-do'] },
  { id:'t06', title:'False Friends — The Big 5', subtitle:'Spanish words that look English but mean something different', level:'B1', rule:'These words exist in English but mean something completely different from their Spanish lookalikes.', examples:[{correct:'Actually = en realidad / de hecho', note:'NOT "actualmente" → use "currently"'},{correct:'Eventually = finalmente / al final', note:'NOT "eventualmente" → use "possibly" or "perhaps"'},{correct:'Sensible = sensato / práctico', note:'NOT "sensible" → use "sensitive"'},{correct:'Sympathetic = comprensivo / empático', note:'NOT "simpático" → use "friendly" or "likeable"'}], trap:'"Embarrassed" ≠ "embarazada". "Embarrassed" = avergonzado. "Pregnant" = embarazada.', tags:['false-friends','B1','vocabulary'] },

const REAL_ENGLISH = [
  { id:'re01', title:'"Make sense" — not "have sense"', category:'collocation', content:'In English, ideas and things MAKE sense. People MAKE sense OF things. Nothing "has sense".', examples:[{text:'That makes sense.', correct:true},{text:'That has sense.', correct:false, note:'Direct translation — never used'},{text:"I can't make sense of this.", correct:true, note:'"make sense of" = understand something confusing'}] },
  { id:'re02', title:'"Interested in" — not "interested by"', category:'preposition', content:'The adjective "interested" always takes the preposition "in", not "by" or "about".', examples:[{text:"I'm interested in learning more.", correct:true},{text:"I'm interested by this topic.", correct:false, note:'"By" works with passive voice but not "interested"'},{text:"She's very interested in history.", correct:true}] },
  { id:'re03', title:'"It depends on" — not "it depends of"', category:'preposition', content:'"Depend" always uses "on" in English. This is one of the most common Spanish-speaker errors.', examples:[{text:'It depends on the situation.', correct:true},{text:'It depends of the situation.', correct:false, note:'Direct translation from Spanish'},{text:'That depends on what you want.', correct:true}] },

const DEFAULT_PROGRESS = { streak:0, lastSessionDate:'', totalMinutes:0, xpTotal:0, xpToday:0, xpTodayDate:'', level:'B1+', errorProfile:[], vocabProgress:{}, phrasalProgress:{}, seenInsights:[], completedExercises:[], sessions:[] };

function useProgress() {
  const [progress, setProgress] = useState(() => {
    try { const s = localStorage.getItem('englsh-progress'); if (s) return { ...DEFAULT_PROGRESS, ...JSON.parse(s) }; } catch {}
    return { ...DEFAULT_PROGRESS };
  });
  const save = (next) => { try { localStorage.setItem('englsh-progress', JSON.stringify(next)); } catch {} };
  const updateStreak = useCallback(() => {
    const today = todayStr();
    setProgress(prev => {
      if (prev.lastSessionDate === today) return prev;
      const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0,10);
      const newStreak = prev.lastSessionDate === yesterday ? prev.streak + 1 : 1;
      const xpToday = prev.xpTodayDate === today ? prev.xpToday : 0;
      const next = { ...prev, streak: newStreak, lastSessionDate: today, xpToday, xpTodayDate: today };
      save(next); return next;
    });
  }, []);
  const addXP = useCallback((amount) => {
    const today = todayStr();
    setProgress(prev => {
      const xpToday = prev.xpTodayDate === today ? prev.xpToday + amount : amount;
      const next = { ...prev, xpTotal: prev.xpTotal + amount, xpToday, xpTodayDate: today };
      save(next); return next;
    });
  }, []);
  const addError = useCallback((ex, userAnswer) => {
    setProgress(prev => {
      const existing = prev.errorProfile.find(e => e.exerciseId === ex.id);
      if (existing) {
        const updated = prev.errorProfile.map(e => e.exerciseId === ex.id ? { ...e, count:(e.count||1)+1, repetitions:0, interval:1, nextReviewDate:daysFromNow(1) } : e);
        const next = { ...prev, errorProfile: updated }; save(next); return next;
      }
      const entry = { exerciseId:ex.id, category:ex.category, subcategory:ex.subcategory, question:ex.question, userAnswer:String(userAnswer), correctAnswer:Array.isArray(ex.options)?ex.options[ex.correctAnswer]:String(ex.correctAnswer), explanation:ex.explanation, timestamp:Date.now(), repetitions:0, interval:1, easeFactor:2.5, nextReviewDate:daysFromNow(1), resolved:false, count:1 };
      const next = { ...prev, errorProfile: [...prev.errorProfile, entry] }; save(next); return next;
    });
  }, []);
  const resolveError = useCallback((exerciseId) => {
    setProgress(prev => { const updated = prev.errorProfile.map(e => e.exerciseId === exerciseId ? { ...e, resolved:true } : e); const next = { ...prev, errorProfile:updated }; save(next); return next; });
  }, []);
  const markExerciseDone = useCallback((id) => {
    setProgress(prev => { if (prev.completedExercises.includes(id)) return prev; const next = { ...prev, completedExercises:[...prev.completedExercises,id] }; save(next); return next; });
  }, []);
  const reviewVocab = useCallback((id, quality) => {
    setProgress(prev => {
      const cur = prev.vocabProgress[id] || { repetitions:0, interval:1, easeFactor:2.5 };
      const updated = sm2Update(cur.repetitions, cur.interval, cur.easeFactor, quality);
      const status = updated.repetitions >= 5 ? 'mastered' : updated.repetitions >= 3 ? 'strong' : updated.repetitions >= 1 ? 'weak' : 'new';
      const next = { ...prev, vocabProgress: { ...prev.vocabProgress, [id]: { ...updated, nextReviewDate:daysFromNow(updated.interval), status } } }; save(next); return next;
    });
  }, []);
  const updatePhrasal = useCallback((id, status) => {
    setProgress(prev => { const next = { ...prev, phrasalProgress:{ ...prev.phrasalProgress, [id]:status } }; save(next); return next; });
  }, []);
  const markInsightSeen = useCallback((id) => {
    setProgress(prev => { if (prev.seenInsights.includes(id)) return prev; const next = { ...prev, seenInsights:[...prev.seenInsights,id] }; save(next); return next; });
  }, []);
  const getDueErrors = useCallback(() => progress.errorProfile.filter(e => !e.resolved && isDue(e.nextReviewDate)), [progress.errorProfile]);
  const getWeakPoints = useCallback(() => {
    const counts = {};
    progress.errorProfile.filter(e => !e.resolved).forEach(e => { counts[e.subcategory] = counts[e.subcategory] || { count:0, category:e.category, entries:[] }; counts[e.subcategory].count += (e.count||1); counts[e.subcategory].entries.push(e); });
    return Object.entries(counts).map(([sub, val]) => ({ subcategory:sub, ...val })).sort((a,b) => b.count-a.count).slice(0,3);
  }, [progress.errorProfile]);
  return { progress, updateStreak, addXP, addError, resolveError, markExerciseDone, reviewVocab, updatePhrasal, markInsightSeen, getDueErrors, getWeakPoints };
}

function Badge({ children, color='blue', small }) {
  const colors = { blue:'#3B82F6', green:'#22C55E', red:'#EF4444', yellow:'#F59E0B', purple:'#8B5CF6', gray:'#9A9A9A' };
  const c = colors[color] || colors.blue;
  return <span style={{ background:c+'22', color:c, border:`1px solid ${c}44`, borderRadius:4, padding:small?'1px 6px':'2px 8px', fontSize:small?10:11, fontWeight:600, letterSpacing:'0.04em', whiteSpace:'nowrap' }}>{children}</span>;
}

function Btn({ children, onClick, variant='primary', small, disabled, style={} }) {
  const styles = { primary:{ background:'#3B82F6', color:'#fff', border:'none' }, ghost:{ background:'transparent', color:'#F0F0F0', border:'1px solid #2A2A2A' }, danger:{ background:'#EF444422', color:'#EF4444', border:'1px solid #EF444444' }, success:{ background:'#22C55E22', color:'#22C55E', border:'1px solid #22C55E44' } };
  return <button onClick={onClick} disabled={disabled} style={{ ...styles[variant], borderRadius:6, padding:small?'4px 10px':'8px 16px', fontSize:small?12:13, fontWeight:600, cursor:disabled?'not-allowed':'pointer', opacity:disabled?0.5:1, transition:'opacity 0.15s', ...style }}>{children}</button>;
}

function Card({ children, style={}, className='' }) {
  return <div className={className} style={{ background:'#161616', border:'1px solid #2A2A2A', borderRadius:10, padding:20, ...style }}>{children}</div>;
}

      <div style={{ padding:'20px 16px 12px', display:'flex', alignItems:'center', justifyContent:'space-between' }}>
        {!collapsed && <span style={{ fontWeight:800, fontSize:17, letterSpacing:'0.15em', color:'#F0F0F0' }}>ENGLSH</span>}
        <button onClick={() => setCollapsed(c=>!c)} style={{ background:'none', border:'none', color:'#555', fontSize:16, padding:4, borderRadius:4, marginLeft:collapsed?'auto':0 }}>{collapsed?'→':'←'}</button>
      </div>
      <nav style={{ flex:1, padding:'4px 8px' }}>
        {NAV.map(n => {
          const active = page === n.id;
          return (
            <button key={n.id} onClick={() => setPage(n.id)} style={{ width:'100%', display:'flex', alignItems:'center', gap:10, padding:'9px 10px', borderRadius:6, border:'none', background:active?'#3B82F611':'transparent', borderLeft:active?'2px solid #3B82F6':'2px solid transparent', color:active?'#F0F0F0':'#9A9A9A', fontSize:13, fontWeight:active?600:400, cursor:'pointer', marginBottom:1, textAlign:'left', transition:'all 0.1s' }}>
              <span style={{ fontSize:16 }}>{n.icon}</span>

function ExerciseCard({ exercise, onCorrect, onWrong, onNext }) {
  const [selected, setSelected] = useState(null);
  const [submitted, setSubmitted] = useState(false);
  const [shake, setShake] = useState(false);
  const handleSubmit = () => {
    if (selected === null) return;
    setSubmitted(true);
    if (selected === exercise.correctAnswer) { onCorrect(); }
    else { setShake(true); setTimeout(() => setShake(false), 400); onWrong(exercise.options[selected]); }
  };
  const correct = submitted && selected === exercise.correctAnswer;
  const typeLabel = { 'complete-sentence':'Complete the sentence', 'detect-mistake':'Detect the mistake', 'natural-vs-unnatural':'Natural or unnatural?', 'choose-best':'Choose the best option', 'translation':'Translate naturally' }[exercise.type] || 'Exercise';
  return (
    <div className="fade-in" style={{ maxWidth:580, margin:'0 auto' }}>
      <div style={{ marginBottom:8 }}>
        <span style={{ fontSize:11, color:'#555', fontWeight:600, textTransform:'uppercase', letterSpacing:'0.08em' }}>{typeLabel}</span>
        <span style={{ marginLeft:10 }}><Badge color={exercise.level==='C1'?'purple':exercise.level==='B2'?'blue':'green'} small>{exercise.level}</Badge></span>
      </div>
      <Card style={{ marginBottom:16, borderColor:submitted?(correct?'#22C55E44':'#EF444444'):'#2A2A2A' }}>
        <div className="mono" style={{ fontSize:17, color:'#F0F0F0', lineHeight:1.6 }}>{exercise.question}</div>
        {exercise.type==='translation' && <div style={{ fontSize:12, color:'#555', marginTop:4 }}>Choose the most natural English translation.</div>}
      </Card>
      <div className={shake?'shake':''} style={{ display:'flex', flexDirection:'column', gap:8, marginBottom:16 }}>
        {exercise.options.map((opt, i) => {
          let borderColor='#2A2A2A', bg='#161616', color='#F0F0F0';
          if (submitted) { if (i===exercise.correctAnswer) { borderColor='#22C55E'; bg='#22C55E11'; color='#22C55E'; } else if (i===selected) { borderColor='#EF4444'; bg='#EF444411'; color='#EF4444'; } else color='#555'; }
          else if (selected===i) { borderColor='#3B82F6'; bg='#3B82F611'; }
          return <button key={i} onClick={() => { if (!submitted) setSelected(i); }} style={{ background:bg, border:`1px solid ${borderColor}`, borderRadius:8, padding:'11px 16px', color, fontSize:14, textAlign:'left', cursor:submitted?'default':'pointer', fontFamily:'inherit', transition:'all 0.15s' }}><span style={{ color:'#555', marginRight:10, fontSize:12 }}>{['A','B','C','D'][i]}</span>{opt}</button>;
        })}
      </div>
      {!submitted && <Btn onClick={handleSubmit} disabled={selected===null} style={{ width:'100%', padding:'11px' }}>Submit Answer</Btn>}
      {submitted && (
        <Card className="fade-in" style={{ borderColor:correct?'#22C55E44':'#EF444444', background:correct?'#22C55E08':'#EF444408' }}>
          <div style={{ fontWeight:700, fontSize:14, color:correct?'#22C55E':'#EF4444', marginBottom:8 }}>{correct?'✓ Correct! +10 XP':'✗ Incorrect (saved to Mistakes)'}</div>
          <div style={{ fontSize:13, color:'#D0D0D0', lineHeight:1.6 }}>{exercise.explanation}</div>
          {exercise.nativeTip && <div style={{ fontSize:12, color:'#F59E0B', marginTop:8, padding:'8px 12px', background:'#F59E0B0A', borderRadius:6, borderLeft:'2px solid #F59E0B' }}>💬 {exercise.nativeTip}</div>}
          <Btn onClick={onNext} style={{ marginTop:14, width:'100%' }}>Next →</Btn>
        </Card>
      )}
    </div>
  );
}

function Dashboard({ progress, setPage, getWeakPoints, getDueErrors }) {
  const hour = new Date().getHours();
  const greeting = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';
  const weakPoints = getWeakPoints();
  const dueErrors = getDueErrors();
  const totalVocabDue = VOCAB_DATA.filter(v => { const p = progress.vocabProgress[v.id]; return !p || isDue(p.nextReviewDate); }).length;
  const subcategoryLabel = s => s.replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
  return (
    <div className="fade-in" style={{ maxWidth:820, margin:'0 auto' }}>
      <div style={{ marginBottom:28 }}>
        <div style={{ fontSize:22, fontWeight:700, color:'#F0F0F0', marginBottom:4 }}>{greeting}.</div>
        <div style={{ fontSize:14, color:'#9A9A9A' }}>{progress.streak>0?`${progress.streak}-day streak. Keep it going.`:'Start your first session today.'}</div>
      </div>
      <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:12, marginBottom:28 }}>

function Practice({ progress, addError, addXP, markExerciseDone, getDueErrors, setPage }) {
  const [mode, setMode] = useState('browse');
  const [queue, setQueue] = useState([]);
  const [qIdx, setQIdx] = useState(0);
  const [score, setScore] = useState(0);
  const [xpGained, setXpGained] = useState(0);
  const [errorsThis, setErrorsThis] = useState(0);
  const buildSession = () => {
    const dueErrIds = getDueErrors().map(e => e.exerciseId);
    const review = EXERCISES.filter(e => dueErrIds.includes(e.id)).slice(0,3);
    const fresh = EXERCISES.filter(e => !dueErrIds.includes(e.id) && !progress.completedExercises.includes(e.id)).sort(() => Math.random()-0.5).slice(0,7);
    return [...review, ...fresh].slice(0,10);
  };
  const startSession = () => { setQueue(buildSession()); setQIdx(0); setScore(0); setXpGained(0); setErrorsThis(0); setMode('session'); };
  const handleCorrect = () => { addXP(10); setScore(s=>s+1); setXpGained(x=>x+10); markExerciseDone(queue[qIdx].id); };
  const handleWrong = (ua) => { addError(queue[qIdx], ua); addXP(5); setXpGained(x=>x+5); setErrorsThis(e=>e+1); };
  const handleNext = () => { if (qIdx+1>=queue.length) { addXP(50); setXpGained(x=>x+50); setMode('summary'); } else setQIdx(i=>i+1); };
  if (mode==='browse') return (
    <div className="fade-in" style={{ maxWidth:700, margin:'0 auto' }}>
      <div style={{ marginBottom:24 }}><h2 style={{ fontSize:20, fontWeight:700, margin:0, marginBottom:4 }}>Practice Mode</h2><p style={{ color:'#9A9A9A', fontSize:13, margin:0 }}>Grammar, naturalness, and vocabulary — adapted to your weak points.</p></div>
      <Card style={{ marginBottom:20, padding:28, textAlign:'center' }}>
        <div style={{ fontSize:14, fontWeight:600, color:'#F0F0F0', marginBottom:8 }}>Daily Session</div>
        <div style={{ fontSize:13, color:'#9A9A9A', marginBottom:20 }}>~10 exercises · includes your error review · ~10 min</div>
        <Btn onClick={startSession} style={{ padding:'12px 36px', fontSize:15 }}>▶ Start Daily Session</Btn>
      </Card>
      <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:10 }}>
        {[{l:'Grammar',n:EXERCISES.filter(e=>e.category==='grammar').length,icon:'📐'},{l:'Naturalness',n:EXERCISES.filter(e=>e.category==='naturalness').length,icon:'💬'},{l:'Vocabulary',n:EXERCISES.filter(e=>e.category==='vocabulary').length,icon:'📖'}].map(cat => (
          <Card key={cat.l} style={{ textAlign:'center', cursor:'pointer', padding:16 }} onClick={startSession}><div style={{ fontSize:24, marginBottom:8 }}>{cat.icon}</div><div style={{ fontSize:13, fontWeight:600, color:'#F0F0F0', marginBottom:4 }}>{cat.l}</div><div style={{ fontSize:11, color:'#555' }}>{cat.n} exercises</div></Card>
        ))}
      </div>
    </div>
  );
  if (mode==='summary') {
    const pct = Math.round((score/queue.length)*100);
    return (
      <div className="fade-in" style={{ maxWidth:480, margin:'0 auto', textAlign:'center' }}>
        <Card style={{ padding:40 }}>
          <div style={{ fontSize:40, marginBottom:16 }}>{pct>=80?'🎯':pct>=60?'👍':'💪'}</div>
          <div style={{ fontSize:22, fontWeight:700, marginBottom:6 }}>{score}/{queue.length} correct</div>
          <div style={{ fontSize:14, color:'#9A9A9A', marginBottom:24 }}>{pct}% accuracy this session</div>
          <div style={{ display:'flex', justifyContent:'center', gap:20, marginBottom:28 }}>
            <div><div style={{ fontSize:20, fontWeight:700, color:'#8B5CF6' }}>+{xpGained}</div><div style={{ fontSize:11, color:'#555' }}>XP earned</div></div>
            <div><div style={{ fontSize:20, fontWeight:700, color:'#EF4444' }}>{errorsThis}</div><div style={{ fontSize:11, color:'#555' }}>errors saved</div></div>
            <div><div style={{ fontSize:20, fontWeight:700, color:'#22C55E' }}>{score}</div><div style={{ fontSize:11, color:'#555' }}>correct</div></div>
          </div>
          {errorsThis>0 && <div style={{ fontSize:13, color:'#F59E0B', marginBottom:20, padding:'10px 16px', background:'#F59E0B0A', borderRadius:8, borderLeft:'2px solid #F59E0B' }}>{errorsThis} mistake{errorsThis!==1?'s':''} saved to your Notebook for review.</div>}
          <div style={{ display:'flex', gap:10, justifyContent:'center' }}>
            <Btn onClick={() => setMode('browse')}>← Back</Btn>
            <Btn onClick={startSession} variant='ghost'>Practice Again</Btn>
          </div>
        </Card>
      </div>
    );
  }
  const ex = queue[qIdx];
  return (
    <div className="fade-in" style={{ maxWidth:640, margin:'0 auto' }}>
      <div style={{ display:'flex', alignItems:'center', gap:12, marginBottom:24 }}>
        <Btn small variant='ghost' onClick={() => setMode('browse')}>← Exit</Btn>
        <div style={{ flex:1, height:4, background:'#1E1E1E', borderRadius:2, overflow:'hidden' }}><div style={{ height:'100%', width:`${(qIdx/queue.length)*100}%`, background:'#3B82F6', borderRadius:2, transition:'width 0.3s' }}/></div>
        <span style={{ fontSize:12, color:'#555', whiteSpace:'nowrap' }}>{qIdx+1} / {queue.length}</span>
      </div>
      <ExerciseCard exercise={ex} onCorrect={handleCorrect} onWrong={handleWrong} onNext={handleNext} />
    </div>
  );
}

              {flipped && (
                <div className="fade-in" style={{ display:'flex', gap:8, marginTop:16 }}>
                  {[{l:'Again',q:0,c:'danger'},{l:'Hard',q:1},{l:'Good',q:2},{l:'Easy',q:3,c:'success'}].map(btn => (
                    <button key={btn.l} onClick={() => handleReview(btn.q)} style={{ flex:1, padding:'10px 4px', borderRadius:8, border:'1px solid #2A2A2A', background:btn.q===0?'#EF444411':btn.q===3?'#22C55E11':'#161616', color:btn.q===0?'#EF4444':btn.q===3?'#22C55E':'#F0F0F0', fontSize:13, cursor:'pointer', fontWeight:600 }}>{btn.l}</button>
                  ))}
                </div>
              )}
            </>
          )}
        </div>
      )}
      {tab==='list' && (
        <>
          <div style={{ display:'flex', gap:6, marginBottom:16 }}>
            {['all','B1','B2','C1'].map(l => <button key={l} onClick={() => setLevelFilter(l)} style={{ padding:'5px 12px', borderRadius:20, border:`1px solid ${levelFilter===l?'#3B82F6':'#2A2A2A'}`, background:levelFilter===l?'#3B82F611':'transparent', color:levelFilter===l?'#3B82F6':'#9A9A9A', fontSize:12, cursor:'pointer', fontWeight:600 }}>{l}</button>)}
          </div>
          <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill,minmax(200px,1fr))', gap:10 }}>
            {allWords.map(v => (
              <Card key={v.id} style={{ padding:14 }}>
                <div style={{ display:'flex', justifyContent:'space-between', marginBottom:6 }}><span className="mono" style={{ fontSize:15, fontWeight:700 }}>{v.word}</span><Badge color={statusColor[getStatus(v.id)]} small>{getStatus(v.id)}</Badge></div>
                <div style={{ fontSize:12, color:'#9A9A9A', marginBottom:4 }}>{v.phonetic}</div>
                <div style={{ fontSize:12, color:'#D0D0D0' }}>{v.translation}</div>
                <div style={{ fontSize:10, color:'#555', marginTop:6 }}><Badge color={v.level==='C1'?'purple':'blue'} small>{v.level}</Badge></div>
              </Card>
            ))}
          </div>
        </>
      )}
    </div>
  );
}

function Theory({ setPage }) {
  const [expanded, setExpanded] = useState(null);
  return (
    <div className="fade-in" style={{ maxWidth:760, margin:'0 auto' }}>
      <div style={{ marginBottom:24 }}><h2 style={{ fontSize:20, fontWeight:700, margin:0, marginBottom:4 }}>Theory Cards</h2><p style={{ color:'#9A9A9A', fontSize:13, margin:0 }}>Visual, practical grammar — linked directly to exercises.</p></div>
      <div style={{ display:'flex', flexDirection:'column', gap:12 }}>
        {THEORY_CARDS.map(card => {
          const open = expanded===card.id;
          return (
            <Card key={card.id} style={{ cursor:'pointer', padding:0, overflow:'hidden' }}>
              <div onClick={() => setExpanded(open?null:card.id)} style={{ padding:'18px 20px', display:'flex', justifyContent:'space-between', alignItems:'center' }}>
                <div><div style={{ display:'flex', gap:8, alignItems:'center', marginBottom:4 }}><span style={{ fontSize:15, fontWeight:700, color:'#F0F0F0' }}>{card.title}</span><Badge color={card.level==='C1'?'purple':'blue'} small>{card.level}</Badge></div><div style={{ fontSize:12, color:'#9A9A9A' }}>{card.subtitle}</div></div>
                <span style={{ color:'#555', fontSize:18, transition:'transform 0.2s', transform:open?'rotate(180deg)':'none' }}>↓</span>
              </div>
              {open && (
                <div className="fade-in" style={{ padding:'0 20px 20px', borderTop:'1px solid #1E1E1E' }}>
                  <div style={{ padding:'12px 16px', background:'#1E1E1E', borderRadius:8, borderLeft:'2px solid #3B82F6', marginTop:16, marginBottom:16, fontSize:13, color:'#D0D0D0', lineHeight:1.7 }}><strong style={{ color:'#F0F0F0' }}>Rule: </strong>{card.rule}</div>
                  <div style={{ marginBottom:12 }}>
                    {card.examples.map((ex,i) => (
                      <div key={i} style={{ marginBottom:8, padding:'8px 12px', borderRadius:6, background:'#0F0F0F' }}>
                        {ex.correct && <div className="mono" style={{ color:'#22C55E', fontSize:13 }}>✓ {ex.correct}</div>}
                        {ex.incorrect && <div className="mono" style={{ color:'#EF4444', fontSize:13 }}>✗ {ex.incorrect}</div>}
                        {ex.correct2 && <div className="mono" style={{ color:'#22C55E', fontSize:13 }}>✓ {ex.correct2}</div>}
                        {ex.note && <div style={{ fontSize:11, color:'#555', marginTop:3 }}>→ {ex.note}</div>}
                      </div>
                    ))}
                  </div>
                  {card.trap && <div style={{ padding:'10px 14px', background:'#F59E0B0A', borderRadius:8, borderLeft:'2px solid #F59E0B', marginBottom:16 }}><span style={{ color:'#F59E0B', fontSize:12, fontWeight:700 }}>⚠ TRAP: </span><span style={{ color:'#D0D0D0', fontSize:12 }}>{card.trap}</span></div>}
                  <div style={{ display:'flex', gap:8, flexWrap:'wrap', alignItems:'center' }}>
                    {card.tags.map(t => <Badge key={t} color='gray' small>#{t}</Badge>)}
                    <Btn small onClick={() => setPage('practice')}>Practice this →</Btn>
                  </div>
                </div>
              )}
            </Card>
          );
        })}
      </div>
    </div>
  );
}

function RealEnglish({ progress, markInsightSeen }) {
  const [catFilter, setCatFilter] = useState('all');
  const [expanded, setExpanded] = useState(null);
  const cats = ['all', ...new Set(REAL_ENGLISH.map(r => r.category))];
  const filtered = catFilter==='all' ? REAL_ENGLISH : REAL_ENGLISH.filter(r => r.category===catFilter);
  const firstUnseen = REAL_ENGLISH.find(r => !progress.seenInsights.includes(r.id));
  return (
    <div className="fade-in" style={{ maxWidth:760, margin:'0 auto' }}>
      <div style={{ marginBottom:24 }}><h2 style={{ fontSize:20, fontWeight:700, margin:0, marginBottom:4 }}>Real English</h2><p style={{ color:'#9A9A9A', fontSize:13, margin:0 }}>What textbooks don't teach you. Colloquial, natural, native.</p></div>
      {firstUnseen && (
        <Card style={{ marginBottom:24, borderColor:'#3B82F644', background:'#3B82F608' }}>
          <div style={{ fontSize:11, color:'#3B82F6', fontWeight:700, textTransform:'uppercase', letterSpacing:'0.08em', marginBottom:8 }}>✶ Today\'s Insight</div>
          <div style={{ fontSize:16, fontWeight:700, color:'#F0F0F0', marginBottom:8 }}>{firstUnseen.title}</div>
          <div style={{ fontSize:13, color:'#D0D0D0', lineHeight:1.7, marginBottom:12 }}>{firstUnseen.content}</div>
          {firstUnseen.examples.map((ex,i) => <div key={i} className="mono" style={{ fontSize:13, marginBottom:6, padding:'6px 12px', borderRadius:6, background:ex.correct?'#22C55E08':'#EF444408', borderLeft:`2px solid ${ex.correct?'#22C55E':'#EF4444'}`, color:ex.correct?'#22C55E':'#EF4444' }}>{ex.correct?'✓':'✗'} {ex.text}{ex.note&&<span style={{ fontSize:11, color:'#9A9A9A', marginLeft:8, fontFamily:'inherit' }}>— {ex.note}</span>}</div>)}
          <Btn small style={{ marginTop:12 }} onClick={() => markInsightSeen(firstUnseen.id)}>Mark as seen ✓</Btn>
        </Card>
      )}
      <div style={{ display:'flex', gap:6, marginBottom:16, flexWrap:'wrap' }}>
        {cats.map(c => <button key={c} onClick={() => setCatFilter(c)} style={{ padding:'5px 12px', borderRadius:20, border:`1px solid ${catFilter===c?'#3B82F6':'#2A2A2A'}`, background:catFilter===c?'#3B82F611':'transparent', color:catFilter===c?'#3B82F6':'#9A9A9A', fontSize:12, cursor:'pointer', fontWeight:600, textTransform:'capitalize' }}>{c}</button>)}
      </div>
      <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
        {filtered.map(insight => {
          const seen = progress.seenInsights.includes(insight.id);
          const open = expanded===insight.id;
          return (
            <Card key={insight.id} style={{ opacity:seen?0.6:1, cursor:'pointer', padding:0, overflow:'hidden' }}>
              <div onClick={() => setExpanded(open?null:insight.id)} style={{ padding:'16px 20px', display:'flex', justifyContent:'space-between', alignItems:'center' }}>
                <div><div style={{ display:'flex', gap:8, alignItems:'center', marginBottom:2 }}><span style={{ fontSize:14, fontWeight:600, color:'#F0F0F0' }}>{insight.title}</span>{seen&&<Badge color='green' small>seen</Badge>}<Badge color='gray' small>{insight.category}</Badge></div>{!open&&<div style={{ fontSize:12, color:'#555' }}>{insight.content.slice(0,60)}...</div>}</div>
                <span style={{ color:'#555', fontSize:16, transition:'transform 0.2s', transform:open?'rotate(180deg)':'none' }}>↓</span>
              </div>
              {open && (
                <div className="fade-in" style={{ padding:'0 20px 20px', borderTop:'1px solid #1E1E1E' }}>
                  <div style={{ fontSize:13, color:'#D0D0D0', lineHeight:1.7, margin:'16px 0 14px' }}>{insight.content}</div>
                  {insight.examples.map((ex,i) => <div key={i} className="mono" style={{ fontSize:13, marginBottom:8, padding:'8px 12px', borderRadius:6, background:ex.correct?'#22C55E08':'#EF444408', borderLeft:`2px solid ${ex.correct?'#22C55E':'#EF4444'}`, color:ex.correct?'#22C55E':'#EF4444' }}>{ex.correct?'✓':'✗'} {ex.text}{ex.note&&<span style={{ fontSize:11, color:'#9A9A9A', marginLeft:8, fontFamily:'inherit' }}>— {ex.note}</span>}</div>)}
                  {!seen && <Btn small style={{ marginTop:12 }} onClick={() => markInsightSeen(insight.id)}>Mark as seen ✓</Btn>}
                </div>
              )}
            </Card>
          );
        })}
      </div>
    </div>
  );
}

function App() {
  const [page, setPage] = useState('dashboard');
  const { progress, updateStreak, addXP, addError, resolveError, markExerciseDone, reviewVocab, updatePhrasal, markInsightSeen, getDueErrors, getWeakPoints } = useProgress();
  useEffect(() => { updateStreak(); }, []);
  const errorCount = progress.errorProfile.filter(e => !e.resolved).length;
  const pages = {
    dashboard: <Dashboard progress={progress} setPage={setPage} getWeakPoints={getWeakPoints} getDueErrors={getDueErrors} />,
    practice: <Practice progress={progress} addError={addError} addXP={addXP} markExerciseDone={markExerciseDone} getDueErrors={getDueErrors} setPage={setPage} />,
    phrasal: <PhrasalVerbs progress={progress} updatePhrasal={updatePhrasal} addXP={addXP} />,
    mistakes: <Mistakes progress={progress} resolveError={resolveError} setPage={setPage} />,
    vocab: <Vocabulary progress={progress} reviewVocab={reviewVocab} />,
    theory: <Theory setPage={setPage} />,
    real: <RealEnglish progress={progress} markInsightSeen={markInsightSeen} />,
  };
  return (
    <div style={{ display:'flex', minHeight:'100vh', background:'#0F0F0F' }}>
      <Sidebar page={page} setPage={setPage} progress={progress} errorCount={errorCount} />
      <main style={{ flex:1, padding:'32px 40px', overflowY:'auto', minHeight:'100vh' }}>
        {pages[page]}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
